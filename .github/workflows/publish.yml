# 发布：推 tag（v0.4.3 形式）自动发 npm。
#
# 认证方式两条，任选其一可用：
#   1) OIDC Trusted Publishing（推荐，无长期 token）
#      npm 包页面 → Settings → Trusted Publishing → 绑定本仓库 + workflow 文件名 publish.yml
#   2) 仓库 secret `NPM_TOKEN`（备选，手机端也能只推 tag 就发布）
#      GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret
#      name: NPM_TOKEN   value: <npm granular token，需 Publish 权限>
#   两条都配了也不冲突：OIDC 优先，token 兜底。
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # OIDC / provenance 需要；用 token 发布时保留也无害

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag($TAG) 与 package.json($VER) 不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: 升级 npm
        run: |
          npm config set registry https://registry.npmjs.org
          npm install -g npm@latest
          npm --version

      - name: 冒烟测试
        run: node test/smoke.mjs

      - name: 已发布过就跳过（手动发过 / 重跑 tag 时不报错）
        id: guard
        run: |
          VER="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER 已在 npm 上，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布（优先 OIDC，缺省回退 NPM_TOKEN；带 provenance）
        if: steps.guard.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::使用 NPM_TOKEN 发布"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          else
            echo "::notice::未配置 NPM_TOKEN，尝试 OIDC Trusted Publishing"
          fi
          npm publish --provenance --access public --ignore-scripts

      - name: 核验发布结果（npm 上必须能查到）
        run: |
          VER="$(node -p \"require(\x27./package.json\x27).version\")"
          NAME="$(node -p \"require(\x27./package.json\x27).name\")"
          for i in 1 2 3 4 5; do
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$VER 已上架"; exit 0
            fi
            echo "第 $i 次查不到，等 15s…"; sleep 15
          done
          echo "::error::$NAME@$VER 发布后仍查不到，判定失败"; exit 1
