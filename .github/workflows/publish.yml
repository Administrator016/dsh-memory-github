# 发布：推 tag（v0.4.2 形式）自动发 npm，走 OIDC Trusted Publishing——不需要任何长期 token。
# 一次性准备：npm 包页面 → Settings → Trusted Publishing → 绑定本仓库 + workflow 文件名 publish.yml
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # OIDC 必需：用来换 npm 的短期发布凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag($TAG) 与 package.json($VER) 不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: 升级 npm（Trusted Publishing 需要 npm 11.5+）
        run: |
          npm config set registry https://registry.npmjs.org
          npm install -g npm@latest
          npm --version

      - name: 冒烟测试
        run: node test/smoke.mjs

      - name: 发布（OIDC，无 token；带 provenance）
        run: npm publish --provenance --access public --ignore-scripts
